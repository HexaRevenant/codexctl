name: Build
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            pkg-config: /usr/lib/x86_64-linux-gnu/pkgconfig
            rustflags: "-L /usr/lib/x86_64-linux-gnu -C link-arg=-Wl,--disable-new-dtags -C link-arg=-Wl,-rpath,/usr/lib/x86_64-linux-gnu"
          - platform: macos-latest
            target: aarch64-apple-darwin
            pkg-config: ""
            rustflags: ""
          - platform: macos-13
            target: x86_64-apple-darwin
            pkg-config: ""
            rustflags: ""
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            pkg-config: ""
            rustflags: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux deps
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev libgtk-3-dev libappindicator3-dev \
            librsvg2-dev libpango1.0-dev libgdk-pixbuf-2.0-dev

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2"

      - name: Prepare CLI sidecar (Unix)
        if: matrix.platform != 'windows-latest'
        run: ./scripts/prepare-sidecar.sh "${{ matrix.target }}"

      - name: Prepare CLI sidecar (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: ./scripts/prepare-sidecar.ps1 "${{ matrix.target }}"

      - name: Build (Linux)
        if: matrix.platform == 'ubuntu-latest'
        run: cargo tauri build --target ${{ matrix.target }}
        working-directory: ${{ github.workspace }}
        env:
          PKG_CONFIG_PATH: ${{ matrix.pkg-config }}
          RUSTFLAGS: ${{ matrix.rustflags }}

      - name: Build (macOS / Windows)
        if: matrix.platform != 'ubuntu-latest'
        run: cargo tauri build --target ${{ matrix.target }}
        working-directory: ${{ github.workspace }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: codexctl-${{ matrix.platform }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/
          if-no-files-found: warn

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: codexctl-*
          merge-multiple: true
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            **/*.deb
            **/*.rpm
            **/*.AppImage
            **/*.dmg
            **/*.msi
