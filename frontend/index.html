<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CodexCTL</title>
<style>
  :root {
    --bg: #1a1a2e; --surface: #16213e; --surface2: #0f3460;
    --accent: #e94560; --text: #eee; --text2: #aaa;
    --green: #2ecc71; --red: #e74c3c;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg); color: var(--text); padding: 20px; min-height: 100vh;
  }
  .header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 20px; flex-wrap: wrap; gap: 10px;
  }
  .header h1 { font-size: 1.5em; color: var(--accent); }
  .active-badge {
    font-size: 0.85em; color: var(--green); background: rgba(46,204,113,0.15);
    padding: 4px 12px; border-radius: 12px;
  }
  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; align-items: center; }
  .target-picker {
    margin-left: auto; font-size: 0.85em; color: var(--text2);
    display: flex; gap: 10px; align-items: center;
    background: var(--surface); padding: 6px 12px; border-radius: 6px;
  }
  .target-picker label { display: flex; align-items: center; gap: 4px; cursor: pointer; }
  .target-picker input { accent-color: var(--accent); cursor: pointer; }
  .toolbar button {
    background: var(--surface2); color: var(--text); border: none;
    padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 0.9em;
  }
  .toolbar button:hover { background: var(--accent); }
  .table-scroll { width: 100%; overflow-x: auto; }
  table { width: 100%; min-width: 1200px; border-collapse: collapse; font-size: 0.9em; }
  th {
    text-align: left; padding: 10px 8px; border-bottom: 2px solid var(--surface2);
    color: var(--text2); font-weight: 600; text-transform: uppercase; font-size: 0.75em;
  }
  td { padding: 10px 8px; border-bottom: 1px solid var(--surface); }
  tr:hover { background: rgba(255,255,255,0.03); }
  tr.active { background: rgba(46,204,113,0.08); }
  .tag { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 0.8em; font-weight: 600; }
  .tag-team { background: #3498db33; color: #3498db; }
  .tag-free { background: #f39c1233; color: #f39c12; }
  .quota-ok { color: var(--green); }
  .quota-warn { color: #f39c12; }
  .quota-full { color: var(--red); }
  .actions button {
    background: none; border: 1px solid var(--surface2); color: var(--text2);
    padding: 3px 8px; border-radius: 4px; cursor: pointer; font-size: 0.8em; margin: 0 2px;
  }
  .actions button:hover { border-color: var(--accent); color: var(--text); }
  .status-bar { margin-top: 16px; padding: 10px; border-radius: 8px; background: var(--surface); color: var(--text2); font-size: 0.85em; }
  .modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.6); z-index: 100; justify-content: center; align-items: center; }
  .modal-overlay.show { display: flex; }
  .modal { background: var(--surface); padding: 24px; border-radius: 12px; min-width: 320px; }
  .modal h2 { margin-bottom: 16px; }
  .modal input { width: 100%; padding: 10px; border: 1px solid var(--surface2); background: var(--bg); color: var(--text); border-radius: 6px; margin-bottom: 12px; font-size: 1em; }
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; }
  .modal-actions button { padding: 8px 20px; border: none; border-radius: 6px; cursor: pointer; font-size: 0.9em; }
  .modal-actions .primary { background: var(--accent); color: white; }
  .modal-actions .secondary { background: var(--surface2); color: var(--text); }
  .toast { position: fixed; bottom: 20px; right: 20px; background: var(--surface); color: var(--text); padding: 12px 20px; border-radius: 8px; border-left: 4px solid var(--green); font-size: 0.9em; opacity: 0; transition: opacity 0.3s; z-index: 200; }
  .toast.show { opacity: 1; }
  .loading { text-align: center; padding: 40px; color: var(--text2); }
  .error-state { display: none; margin: 20px 0; padding: 16px; border: 1px solid var(--red); border-radius: 8px; color: var(--red); background: rgba(231,76,60,0.1); }
  .actions button:disabled { opacity: 0.6; cursor: wait; }
  .actions .reauth-button { background: var(--accent); border-color: var(--accent); color: white; font-weight: 700; }
  .actions .reauth-button:hover { background: #c7354d; border-color: #c7354d; color: white; }
  .additional-limits { margin-top: 6px; color: var(--text2); font-size: 0.8em; line-height: 1.5; }
  .additional-limit { display: block; }
  .quota-error { display: inline-block; margin-left: 6px; color: var(--red); cursor: help; font-size: 0.9em; }
</style>
</head>
<body>
<div class="header">
  <h1>⌘ CodexCTL <span id="version" style="font-size:0.55em;color:var(--text2);font-weight:400"></span></h1>
  <div id="activeBadge" class="active-badge">—</div>
</div>
<div class="toolbar">
  <button onclick="refreshAll()">🔄 Actualizar</button>
  <button onclick="showAddModal()">➕ Agregar</button>
  <button onclick="exportAccounts()">📤 Exportar</button>
  <button onclick="importAccounts()">📥 Importar</button>
  <span class="target-picker">
    Cambiar en:
    <label><input type="checkbox" id="tgtCodex" checked> Codex</label>
    <label><input type="checkbox" id="tgtOpencode"> OpenCode</label>
  </span>
</div>
<div id="loading" class="loading">Cargando...</div>
<div id="errorState" class="error-state" role="alert"></div>
<div class="table-scroll">
<table id="accountsTable" style="display:none">
  <thead><tr>
    <th>Cuenta</th><th>Email</th><th>Plan</th><th>Activo en</th><th>5h%</th><th>Disp.</th><th>7d%</th><th>Disp.</th><th>Reinicio</th><th>Reinicios gratis</th><th></th>
  </tr></thead>
  <tbody id="tbody"></tbody>
</table>
</div>
<div class="status-bar" id="statusBar"></div>
<div class="modal-overlay" id="addModal">
  <div class="modal">
    <h2>Agregar cuenta</h2>
    <p style="margin-bottom:12px;color:var(--text2);font-size:0.9em">Se abrirá el navegador para iniciar sesión.</p>
    <input id="nicknameInput" placeholder="Ej: Plus Personal" autofocus>
    <div class="modal-actions">
      <button class="secondary" onclick="closeModal('addModal')">Cancelar</button>
      <button class="primary" onclick="addAccount()">Agregar</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
// ── Tauri IPC: works in Tauri v2 webview ────────────────────────
const _INVOKE = window.__TAURI_INTERNALS__?.invoke
  || window.__TAURI__?.core?.invoke
  || window.__TAURI__?.invoke;

if (!_INVOKE) {
  document.body.innerHTML = `<div style="padding:40px;color:var(--red);text-align:center">
    <h2>Error: Tauri IPC no disponible</h2>
    <p>URL: ${location.href}</p>
    <p>globals: ${Object.getOwnPropertyNames(window).filter(k => k.includes('TAURI')||k.includes('ipc')).join(', ') || 'ninguno'}</p>
  </div>`;
  throw new Error("IPC unavailable");
}

async function invoke(cmd, args) {
  try { return await _INVOKE(cmd, args || {}); }
  catch(e) { throw new Error(typeof e === 'string' ? e : e.message || String(e)); }
}

// ── Auto-refresh cada 5 minutos ────────────────────────────────
const AUTO_REFRESH_MIN = 5;
let autoTimer;

function startAutoRefresh() {
  clearInterval(autoTimer);
  autoTimer = setInterval(() => {
    refreshAll();
    showToast(`🔄 Auto-actualizado (cada ${AUTO_REFRESH_MIN} min)`);
  }, AUTO_REFRESH_MIN * 60 * 1000);
}

// ── Init ────────────────────────────────────────────────────────
window.addEventListener("DOMContentLoaded", () => {
  loadVersion();
  refreshAll();
  startAutoRefresh();
});

async function loadVersion() {
  try {
    const version = await invoke("get_version");
    document.title = `CodexCTL v${version}`;
    document.getElementById("version").textContent = `v${version}`;
  } catch(e) { showToast("Error cargando la versión: " + e, true); }
}

async function refreshAll() {
  const errorState = document.getElementById("errorState");
  document.getElementById("loading").style.display = "";
  errorState.style.display = "none";
  try {
    const accounts = await invoke("list_accounts", { fetchQuota: false });
    const status = await invoke("get_status");
    renderTable(accounts, status);
    updateStatus(accounts, status);
    document.getElementById("loading").style.display = "none";
    document.getElementById("accountsTable").style.display = "";

    try {
      const accountsWithQuota = await invoke("list_accounts", { fetchQuota: true });
      renderTable(accountsWithQuota, status);
      updateStatus(accountsWithQuota, status);
    } catch(e) {
      const message = e?.message || String(e);
      errorState.textContent = `No se pudieron actualizar las cuotas: ${message}. Las cuentas locales siguen visibles.`;
      errorState.style.display = "block";
      showToast("Error actualizando las cuotas", true);
    }
  } catch(e) {
    const message = e?.message || String(e);
    errorState.textContent = `No se pudieron cargar las cuentas: ${message}`;
    errorState.style.display = "block";
    document.getElementById("loading").style.display = "none";
    showToast("Error cargando las cuentas", true);
  }
}

async function switchAccount(id) {
  try {
    const targets = [];
    if (document.getElementById("tgtCodex").checked) targets.push("codex");
    if (document.getElementById("tgtOpencode").checked) targets.push("opencode");
    if (targets.length === 0) { showToast("Seleccioná al menos un destino (Codex u OpenCode)", true); return; }

    const msg = await invoke("switch_account_targets", { accountId: id, targets });
    showToast(msg); await refreshAll();
  } catch(e) { showToast("Error: " + e, true); }
}

function showAddModal() {
  document.getElementById("nicknameInput").value = "";
  document.getElementById("addModal").classList.add("show");
  setTimeout(() => document.getElementById("nicknameInput")?.focus(), 100);
}

async function addAccount() {
  const nickname = document.getElementById("nicknameInput").value.trim();
  if (!nickname) return;
  closeModal("addModal");
  showToast("⏳ Abriendo navegador...");
  try {
    const msg = await invoke("add_account", { nickname });
    showToast(msg); await refreshAll();
  } catch(e) { showToast("Error: " + e, true); }
}

async function reauthAccount(accountOrButton, button) {
  const clickedButton = accountOrButton instanceof HTMLElement
    ? accountOrButton
    : button || document.querySelector(`.reauth-button[data-account-id="${CSS.escape(String(accountOrButton))}"]`);
  const id = clickedButton?.dataset.accountId || String(accountOrButton);
  const errorState = document.getElementById("errorState");
  errorState.textContent = "Reautenticando cuenta... Se abrirá el navegador para iniciar sesión.";
  errorState.style.display = "block";
  if (clickedButton) {
    clickedButton.disabled = true;
    clickedButton.textContent = "Reautenticando...";
  }
  try {
    const msg = await invoke("reauth_account", { accountId: id });
    showToast(msg);
    await refreshAll();
  } catch(e) {
    const message = e?.message || String(e);
    errorState.textContent = `No se pudo reautenticar la cuenta: ${message}. Se conservaron las credenciales anteriores.`;
    errorState.style.display = "block";
    showToast("Error en la reautenticación", true);
  } finally {
    if (clickedButton?.isConnected) {
      clickedButton.disabled = false;
      clickedButton.textContent = "Reautenticar";
    }
  }
}

async function renameAccount(id) {
  const name = prompt("Nuevo nombre:");
  if (!name?.trim()) return;
  try {
    const msg = await invoke("rename_account", { accountId: id, nickname: name.trim() });
    showToast(msg); await refreshAll();
  } catch(e) { showToast("Error: " + e, true); }
}

async function removeAccount(id, nickname) {
  if (!confirm(`¿Eliminar "${nickname}"?`)) return;
  try {
    const msg = await invoke("remove_account", { accountId: id });
    showToast(msg); await refreshAll();
  } catch(e) { showToast("Error: " + e, true); }
}

async function exportAccounts() {
  try {
    const path = await invoke('plugin:dialog|save', {
      options: {
        title: "Guardar cuentas",
        defaultPath: "codexctl-cuentas.json",
        filters: [{ name: 'JSON', extensions: ['json'] }]
      }
    });
    if (!path) return; // cancelado
    const msg = await invoke("export_accounts", { path });
    showToast(msg);
  } catch(e) { showToast("Error: " + e, true); }
}

async function importAccounts() {
  try {
    const path = await invoke('plugin:dialog|open', {
      options: {
        title: "Importar cuentas",
        filters: [{ name: 'JSON', extensions: ['json'] }]
      }
    });
    if (!path) return; // cancelado
    const msg = await invoke("import_accounts", { path: String(path) });
    showToast(msg);
    await refreshAll();
  } catch(e) { showToast("Error: " + e, true); }
}

function renderTable(accounts, status) {
  const tbody = document.getElementById("tbody");
  tbody.innerHTML = "";
  for (const a of accounts) {
    const tr = document.createElement("tr");
    if (a.is_active) tr.classList.add("active");
    const q5 = quotaClass(a.quota_5h), q7 = quotaClass(a.quota_7d);
    const freeResets = a.rate_limit_reset_credits;
    const freeResetText = freeResets
      ? `${freeResets.applicable_available_count} / ${freeResets.available_count}`
      : "—";
    const activeIn = a.active_in === "both" ? "Ambos" : a.active_in === "codex" ? "Codex" : a.active_in === "opencode" ? "OpenCode" : "—";
    const activeInClass = a.active_in === "both" ? "tag-team" : a.active_in === "codex" ? "tag-team" : a.active_in === "opencode" ? "tag-free" : "";
    tr.innerHTML = `
      <td><strong>${esc(a.nickname)}</strong> ${a.is_active ? '<span style="color:var(--green)">●</span>' : ''}${renderQuotaError(a.quota_error)}${renderAdditionalLimits(a.additional_rate_limits)}</td>
      <td style="color:var(--text2)">${esc(a.email)}</td>
      <td><span class="tag tag-${a.plan_type}">${esc(a.plan_type)}</span></td>
      <td><span class="tag ${activeInClass}">${esc(activeIn)}</span></td>
      <td class="${q5}">${esc(a.quota_5h)}</td>
      <td class="${q5}">${esc(a.disp_5h)}</td>
      <td class="${q7}">${esc(a.quota_7d)}</td>
      <td class="${q7}">${esc(a.disp_7d)}</td>
      <td style="color:var(--text2);font-size:0.85em">${esc(a.reset_at)}</td>
      <td style="color:var(--text2);font-size:0.85em">${esc(freeResetText)}</td>
      <td class="actions">
        <button onclick="switchAccount('${a.id}')">Activar</button>
        <button class="reauth-button" data-account-id="${esc(a.id)}">Reautenticar</button>
        <button onclick="renameAccount('${a.id}')">✎</button>
        <button onclick="removeAccount('${a.id}','${esc(a.nickname)}')">✕</button>
      </td>`;
    tbody.appendChild(tr);
  }
  tbody.querySelectorAll(".reauth-button").forEach(button => {
    button.addEventListener("click", () => reauthAccount(button.dataset.accountId, button));
  });
  const badge = document.getElementById("activeBadge");
  badge.textContent = status?.nickname ? `✓ ${status.nickname}` : "❌ Ninguna activa";
}

function updateStatus(accounts, status) {
  const bar = document.getElementById("statusBar");
  const total = accounts.length;
  const blocked = accounts.filter(a => a.quota_5h === "100%" || a.quota_7d === "100%").length;
  bar.textContent = `📊 ${total} cuentas · ${blocked} al límite · ${total - blocked} con quota`;
}

function quotaClass(v) {
  const n = parseFloat(v);
  if (isNaN(n)) return "";
  if (n >= 100) return "quota-full";
  if (n >= 80) return "quota-warn";
  return "quota-ok";
}

function renderAdditionalLimits(limits) {
  if (!limits?.length) return "";
  const rows = limits.map(l => {
    const reset = l.reset_after_seconds == null ? l.reset_at : `${l.reset_after_seconds}s · ${l.reset_at}`;
    return `<span class="additional-limit">${esc(l.limit_name)} / ${esc(l.metered_feature)}: ${esc(l.used_percent)} · reset ${esc(reset)}</span>`;
  }).join("");
  return `<div class="additional-limits">${rows}</div>`;
}

function renderQuotaError(error) {
  if (!error) return "";
  const message = `Quota: ${error}`;
  return `<span class="quota-error" title="${esc(message)}" aria-label="${esc(message)}">⚠</span>`;
}

function closeModal(id) { document.getElementById(id).classList.remove("show"); }

let toastTimer;
function showToast(msg, err) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.style.borderLeftColor = err ? "var(--red)" : "var(--green)";
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 3000);
}

function esc(s) { const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
</body>
</html>
