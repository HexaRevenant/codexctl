<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CodexCTL</title>
<style>
  :root {
    --bg: #1a1a2e; --surface: #16213e; --surface2: #0f3460;
    --accent: #e94560; --text: #eee; --text2: #aaa;
    --green: #2ecc71; --red: #e74c3c;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg); color: var(--text); padding: 20px; min-height: 100vh;
  }
  .header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 20px; flex-wrap: wrap; gap: 10px;
  }
  .header h1 { font-size: 1.5em; color: var(--accent); }
  .active-badge {
    font-size: 0.85em; color: var(--green); background: rgba(46,204,113,0.15);
    padding: 4px 12px; border-radius: 12px;
  }
  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
  .toolbar button {
    background: var(--surface2); color: var(--text); border: none;
    padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 0.9em;
  }
  .toolbar button:hover { background: var(--accent); }
  table { width: 100%; border-collapse: collapse; font-size: 0.9em; }
  th {
    text-align: left; padding: 10px 8px; border-bottom: 2px solid var(--surface2);
    color: var(--text2); font-weight: 600; text-transform: uppercase; font-size: 0.75em;
  }
  td { padding: 10px 8px; border-bottom: 1px solid var(--surface); }
  tr:hover { background: rgba(255,255,255,0.03); }
  tr.active { background: rgba(46,204,113,0.08); }
  .tag { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 0.8em; font-weight: 600; }
  .tag-team { background: #3498db33; color: #3498db; }
  .tag-free { background: #f39c1233; color: #f39c12; }
  .quota-ok { color: var(--green); }
  .quota-warn { color: #f39c12; }
  .quota-full { color: var(--red); }
  .actions button {
    background: none; border: 1px solid var(--surface2); color: var(--text2);
    padding: 3px 8px; border-radius: 4px; cursor: pointer; font-size: 0.8em; margin: 0 2px;
  }
  .actions button:hover { border-color: var(--accent); color: var(--text); }
  .status-bar { margin-top: 16px; padding: 10px; border-radius: 8px; background: var(--surface); color: var(--text2); font-size: 0.85em; }
  .modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.6); z-index: 100; justify-content: center; align-items: center; }
  .modal-overlay.show { display: flex; }
  .modal { background: var(--surface); padding: 24px; border-radius: 12px; min-width: 320px; }
  .modal h2 { margin-bottom: 16px; }
  .modal input { width: 100%; padding: 10px; border: 1px solid var(--surface2); background: var(--bg); color: var(--text); border-radius: 6px; margin-bottom: 12px; font-size: 1em; }
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; }
  .modal-actions button { padding: 8px 20px; border: none; border-radius: 6px; cursor: pointer; font-size: 0.9em; }
  .modal-actions .primary { background: var(--accent); color: white; }
  .modal-actions .secondary { background: var(--surface2); color: var(--text); }
  .toast { position: fixed; bottom: 20px; right: 20px; background: var(--surface); color: var(--text); padding: 12px 20px; border-radius: 8px; border-left: 4px solid var(--green); font-size: 0.9em; opacity: 0; transition: opacity 0.3s; z-index: 200; }
  .toast.show { opacity: 1; }
  .loading { text-align: center; padding: 40px; color: var(--text2); }
</style>
</head>
<body>
<div class="header">
  <h1>⌘ CodexCTL</h1>
  <div id="activeBadge" class="active-badge">—</div>
</div>
<div class="toolbar">
  <button onclick="refreshAll()">🔄 Actualizar</button>
  <button onclick="showAddModal()">➕ Agregar</button>
  <button onclick="exportAccounts()">📤 Exportar</button>
  <button onclick="importAccounts()">📥 Importar</button>
</div>
<div id="loading" class="loading">Cargando...</div>
<table id="accountsTable" style="display:none">
  <thead><tr>
    <th>Cuenta</th><th>Email</th><th>Plan</th><th>5h%</th><th>Disp.</th><th>7d%</th><th>Disp.</th><th>Reinicio</th><th></th>
  </tr></thead>
  <tbody id="tbody"></tbody>
</table>
<div class="status-bar" id="statusBar"></div>
<div class="modal-overlay" id="addModal">
  <div class="modal">
    <h2>Agregar cuenta</h2>
    <p style="margin-bottom:12px;color:var(--text2);font-size:0.9em">Se abrirá el navegador para iniciar sesión.</p>
    <input id="nicknameInput" placeholder="Ej: Plus Personal" autofocus>
    <div class="modal-actions">
      <button class="secondary" onclick="closeModal('addModal')">Cancelar</button>
      <button class="primary" onclick="addAccount()">Agregar</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
// ── Tauri IPC: works in Tauri v2 webview ────────────────────────
const _INVOKE = window.__TAURI_INTERNALS__?.invoke
  || window.__TAURI__?.core?.invoke
  || window.__TAURI__?.invoke;

if (!_INVOKE) {
  document.body.innerHTML = `<div style="padding:40px;color:var(--red);text-align:center">
    <h2>Error: Tauri IPC no disponible</h2>
    <p>URL: ${location.href}</p>
    <p>globals: ${Object.getOwnPropertyNames(window).filter(k => k.includes('TAURI')||k.includes('ipc')).join(', ') || 'ninguno'}</p>
  </div>`;
  throw new Error("IPC unavailable");
}

async function invoke(cmd, args) {
  try { return await _INVOKE(cmd, args || {}); }
  catch(e) { throw new Error(typeof e === 'string' ? e : e.message || String(e)); }
}

// ── Auto-refresh cada 5 minutos ────────────────────────────────
const AUTO_REFRESH_MIN = 5;
let autoTimer;

function startAutoRefresh() {
  clearInterval(autoTimer);
  autoTimer = setInterval(() => {
    refreshAll();
    showToast(`🔄 Auto-actualizado (cada ${AUTO_REFRESH_MIN} min)`);
  }, AUTO_REFRESH_MIN * 60 * 1000);
}

// ── Init ────────────────────────────────────────────────────────
window.addEventListener("DOMContentLoaded", () => {
  refreshAll();
  startAutoRefresh();
});

async function refreshAll() {
  document.getElementById("loading").style.display = "";
  document.getElementById("accountsTable").style.display = "none";
  try {
    const accounts = await invoke("list_accounts", { fetchQuota: true });
    const status = await invoke("get_status");
    renderTable(accounts, status);
    updateStatus(accounts, status);
  } catch(e) { showToast("Error: " + e, true); }
  document.getElementById("loading").style.display = "none";
  document.getElementById("accountsTable").style.display = "";
}

async function switchAccount(id) {
  try {
    const msg = await invoke("switch_account", { accountId: id });
    showToast(msg); await refreshAll();
  } catch(e) { showToast("Error: " + e, true); }
}

function showAddModal() {
  document.getElementById("nicknameInput").value = "";
  document.getElementById("addModal").classList.add("show");
  setTimeout(() => document.getElementById("nicknameInput")?.focus(), 100);
}

async function addAccount() {
  const nickname = document.getElementById("nicknameInput").value.trim();
  if (!nickname) return;
  closeModal("addModal");
  showToast("⏳ Abriendo navegador...");
  try {
    const msg = await invoke("add_account", { nickname });
    showToast(msg); await refreshAll();
  } catch(e) { showToast("Error: " + e, true); }
}

async function renameAccount(id) {
  const name = prompt("Nuevo nombre:");
  if (!name?.trim()) return;
  try {
    const msg = await invoke("rename_account", { accountId: id, nickname: name.trim() });
    showToast(msg); await refreshAll();
  } catch(e) { showToast("Error: " + e, true); }
}

async function removeAccount(id, nickname) {
  if (!confirm(`¿Eliminar "${nickname}"?`)) return;
  try {
    const msg = await invoke("remove_account", { accountId: id });
    showToast(msg); await refreshAll();
  } catch(e) { showToast("Error: " + e, true); }
}

async function exportAccounts() {
  try {
    const path = await invoke('plugin:dialog|save', {
      options: {
        title: "Guardar cuentas",
        defaultPath: "codexctl-cuentas.json",
        filters: [{ name: 'JSON', extensions: ['json'] }]
      }
    });
    if (!path) return; // cancelado
    const msg = await invoke("export_accounts", { path });
    showToast(msg);
  } catch(e) { showToast("Error: " + e, true); }
}

async function importAccounts() {
  try {
    const path = await invoke('plugin:dialog|open', {
      options: {
        title: "Importar cuentas",
        filters: [{ name: 'JSON', extensions: ['json'] }]
      }
    });
    if (!path) return; // cancelado
    const msg = await invoke("import_accounts", { path: String(path) });
    showToast(msg);
    await refreshAll();
  } catch(e) { showToast("Error: " + e, true); }
}

function renderTable(accounts, status) {
  const tbody = document.getElementById("tbody");
  tbody.innerHTML = "";
  for (const a of accounts) {
    const tr = document.createElement("tr");
    if (a.is_active) tr.classList.add("active");
    const q5 = quotaClass(a.quota_5h), q7 = quotaClass(a.quota_7d);
    tr.innerHTML = `
      <td><strong>${esc(a.nickname)}</strong> ${a.is_active ? '<span style="color:var(--green)">●</span>' : ''}</td>
      <td style="color:var(--text2)">${esc(a.email)}</td>
      <td><span class="tag tag-${a.plan_type}">${esc(a.plan_type)}</span></td>
      <td class="${q5}">${esc(a.quota_5h)}</td>
      <td class="${q5}">${esc(a.disp_5h)}</td>
      <td class="${q7}">${esc(a.quota_7d)}</td>
      <td class="${q7}">${esc(a.disp_7d)}</td>
      <td style="color:var(--text2);font-size:0.85em">${esc(a.reset_at)}</td>
      <td class="actions">
        <button onclick="switchAccount('${a.id}')">Activar</button>
        <button onclick="renameAccount('${a.id}')">✎</button>
        <button onclick="removeAccount('${a.id}','${esc(a.nickname)}')">✕</button>
      </td>`;
    tbody.appendChild(tr);
  }
  const badge = document.getElementById("activeBadge");
  badge.textContent = status?.nickname ? `✓ ${status.nickname}` : "❌ Ninguna activa";
}

function updateStatus(accounts, status) {
  const bar = document.getElementById("statusBar");
  const total = accounts.length;
  const blocked = accounts.filter(a => a.quota_5h === "100%" || a.quota_7d === "100%").length;
  bar.textContent = `📊 ${total} cuentas · ${blocked} al límite · ${total - blocked} con quota`;
}

function quotaClass(v) {
  const n = parseFloat(v);
  if (isNaN(n)) return "";
  if (n >= 100) return "quota-full";
  if (n >= 80) return "quota-warn";
  return "quota-ok";
}

function closeModal(id) { document.getElementById(id).classList.remove("show"); }

let toastTimer;
function showToast(msg, err) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.style.borderLeftColor = err ? "var(--red)" : "var(--green)";
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 3000);
}

function esc(s) { const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
</script>
</body>
</html>
